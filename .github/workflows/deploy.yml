name: Publicar Amorosa

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Obtener código
        uses: actions/checkout@v7

      - name: Instalar Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar
        run: npm run build
        env:
          GITHUB_PAGES: 'true'

      - name: Configurar Pages
        uses: actions/configure-pages@v6

      - name: Subir archivos compilados
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Publicar web
        id: deployment
        uses: actions/deploy-pages@v5